<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PokeChill 配招伤害最优计算器</title>

  <!-- PWA 配置 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PokeChill计算器">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">

  <!-- Tesseract.js OCR 库 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #F3F4F6;
      --card-bg: #FFFFFF;
      --title: #1F2937;
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --success: #059669;
      --danger: #DC2626;
      --text: #1F2937;
      --muted: #6B7280;
      --border: #E5E7EB;
      --border-focus: #6366F1;
      --radius-card: 20px;
      --radius-input: 14px;
      --radius-btn: 12px;
      --shadow-card: 0 4px 20px rgba(0,0,0,0.06);
      --shadow-hover: 0 4px 16px rgba(79,70,229,0.25);
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      margin: 0;
      padding: 16px 12px 100px;
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .app-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--title);
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .app-subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 16px;
      font-weight: 400;
    }

    .note {
      background: #EEF2FF;
      border-left: 4px solid var(--primary);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
      color: #374151;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-card);
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 17px;
      font-weight: 700;
      color: var(--title);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card h2 .icon {
      font-size: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    input,
    select,
    textarea {
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-input);
      font-size: 15px;
      background: #fff;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
      color: var(--text);
      -webkit-appearance: none;
      appearance: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }

    .btn {
      padding: 12px 18px;
      border: none;
      border-radius: var(--radius-btn);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #E5E7EB;
      color: #1F2937;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      flex: 1;
      min-height: 46px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px rgba(79,70,229,0.3);
    }

    .btn-primary:active {
      background: var(--primary-hover);
      box-shadow: 0 1px 4px rgba(79,70,229,0.4);
    }

    .btn-success {
      background: var(--success);
      color: #fff;
      box-shadow: 0 2px 8px rgba(5,150,105,0.3);
    }

    .btn-danger {
      background: #FEE2E2;
      color: var(--danger);
    }

    .btn-sm {
      padding: 8px 12px;
      font-size: 13px;
      min-height: auto;
      flex: none;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .move-row {
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      margin-bottom: 6px;
      background: #FAFBFC;
      transition: border-color 0.2s;
    }

    .move-row:focus-within {
      border-color: var(--border-focus);
    }

    .move-row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      gap: 8px;
    }

    .move-row-summary {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 14px;
      font-weight: 600;
    }

    .move-row-summary .mv-name {
      color: var(--title);
    }

    .move-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .tag-physical { background: #FEE2E2; color: #B91C1C; }
    .tag-special { background: #DBEAFE; color: #1D4ED8; }
    .tag-buff { background: #FEF3C7; color: #B45309; }
    .tag-type { background: #E0E7FF; color: #3730A3; }

    .move-row-detail {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .move-row-detail.show {
      display: flex;
    }

    .move-row-detail input,
    .move-row-detail select {
      font-size: 14px;
      padding: 8px 10px;
    }

    .move-row-detail .mName { flex: 1 1 100px; min-width: 80px; }
    .move-row-detail .mType { min-width: 90px; flex: 0 0 auto; }
    .move-row-detail .mCategory { min-width: 80px; flex: 0 0 auto; }
    .move-row-detail .mPower { width: 70px; flex: 0 0 auto; }

    .delete-btn {
      background: none;
      border: none;
      color: #9CA3AF;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 6px;
      transition: color 0.2s;
    }

    .delete-btn:hover { color: var(--danger); }

    .chevron {
      transition: transform 0.25s ease;
      font-size: 12px;
      color: var(--muted);
    }

    .chevron.open { transform: rotate(180deg); }

    .search-wrapper {
      position: relative;
    }

    .search-results {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .search-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid #F3F4F6;
      font-size: 14px;
      transition: background 0.15s;
    }

    .search-item:last-child { border-bottom: none; }
    .search-item:hover, .search-item:active { background: #EEF2FF; }
    .search-item .si-type { color: var(--muted); font-size: 12px; margin-left: 4px; }

    .ocr-area {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .ocr-preview {
      max-width: 100%;
      max-height: 160px;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
      object-fit: contain;
    }

    .ocr-result-text {
      background: #F9FAFB;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.6;
      max-height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--muted);
      margin-top: 8px;
    }

    .result-panel {
      background: #EFF6FF;
      border: 1.5px solid #BFDBFE;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .result-panel .total {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .result-panel .seq {
      margin: 6px 0;
      font-size: 14px;
      line-height: 1.6;
      font-weight: 600;
    }

    .result-panel .detail {
      font-size: 13px;
      color: #4B5563;
      margin-top: 6px;
      line-height: 1.8;
    }

    .result-panel .rank-badge {
      display: inline-block;
      background: var(--primary);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 4px;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
      z-index: 50;
    }

    .enemy-set-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .enemy-set-row select {
      flex: 1;
      min-width: 100px;
    }

    .hidden { display: none !important; }

    @media (max-width: 420px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .btn { font-size: 14px; padding: 11px 14px; }
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .buff-config-inline {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="app-title">⚡ PokeChill 配招计算器</div>
  <div class="app-subtitle">截图识别 · 最优配招 · 一轮总伤害</div>

  <!-- 规则卡片 -->
  <div class="note">
    <b>本系加成</b>：单属性 ×1.7，双属性 ×1.5<br>
    <b>交叉之力</b>：与上一个伤害招式属性不同时触发，默认 ×1.3<br>
    <b>天气加成</b>：匹配天气属性 ×1.5<br>
    <b>敌方克制</b>：绝佳 ×1.5，不佳 ×0.5，免疫 ×0，双属性相乘
  </div>

  <!-- OCR 截图识别 -->
  <div class="card">
    <h2><span class="icon">📸</span>截图导入招式</h2>
    <p class="muted" style="margin-top:-6px;font-size:13px;">上传PokeChill招式页面截图，自动识别招式并填入</p>
    <div class="ocr-area">
      <input type="file" id="ocrInput" accept="image/*" capture="environment" style="display:none">
      <button class="btn btn-primary" id="ocrBtn">
        <span id="ocrBtnText">📷 上传截图</span>
      </button>
      <button class="btn btn-sm" id="ocrClearBtn" style="display:none;">清除</button>
    </div>
    <img id="ocrPreview" class="ocr-preview" alt="预览">
    <div id="ocrResultText" class="ocr-result-text" style="display:none;"></div>
    <div id="ocrStatus" class="muted" style="margin-top:8px;font-size:13px;"></div>
  </div>

  <!-- 搜索招式 -->
  <div class="card">
    <h2><span class="icon">🔍</span>搜索招式</h2>
    <div class="search-wrapper">
      <input id="moveSearch" placeholder="拼音首字母或名称，如 ftgj / 伏特攻击" autocomplete="off">
      <div id="searchResults" class="search-results hidden"></div>
    </div>
  </div>

  <!-- 宝可梦基础 -->
  <div class="card">
    <h2><span class="icon">🎯</span>宝可梦基础</h2>
    <div class="grid-4">
      <label>属性1
        <select id="pokeType1"></select>
      </label>
      <label>属性2
        <select id="pokeType2"></select>
      </label>
      <label>攻击
        <input id="atk" type="number" min="1" placeholder="—">
      </label>
      <label>特攻
        <input id="spa" type="number" min="1" placeholder="—">
      </label>
    </div>
    <div class="grid" style="margin-top:10px;">
      <label>天气
        <select id="weather"></select>
      </label>
      <div id="customWeather" class="hidden" style="display:flex;gap:6px;">
        <select id="customWeatherType1"></select>
        <select id="customWeatherType2"></select>
      </div>
      <label>交叉倍率
        <input id="crossMult" type="number" step="0.1" min="1" value="1.3">
      </label>
      <label>天气倍率
        <input id="weatherMult" type="number" step="0.1" min="1" value="1.5">
      </label>
    </div>
  </div>

  <!-- 敌方属性 -->
  <div class="card">
    <h2><span class="icon">👾</span>敌方属性</h2>
    <div class="btn-row" style="margin-bottom:8px;">
      <button class="btn btn-sm btn-primary" id="autoRecommend">✨ 自动推荐克制</button>
      <button class="btn btn-sm" id="addEnemySet">＋ 手动添加</button>
    </div>
    <div id="enemySets"></div>
  </div>

  <!-- 候选招式 -->
  <div class="card">
    <h2><span class="icon">📋</span>候选招式 <span id="moveCount" style="font-size:13px;color:var(--muted);font-weight:400;">(0/20)</span></h2>
    <div class="btn-row" style="margin-bottom:8px;">
      <button class="btn btn-sm" id="addMove">＋ 手动添加</button>
      <button class="btn btn-sm btn-danger" id="clearAll">🗑 清空全部</button>
      <button class="btn btn-sm" id="expandAll">▾ 全部展开</button>
    </div>
    <div id="moveList"></div>
    <div class="btn-row" style="margin-top:10px;">
      <label style="font-size:13px;font-weight:600;flex-direction:row;align-items:center;gap:6px;">
        <input type="checkbox" id="buffFirst" checked style="width:auto;">
        Buff必须第一招
      </label>
    </div>
  </div>

  <!-- 结果 -->
  <div class="card">
    <h2><span class="icon">📊</span>计算结果</h2>
    <div id="results"><p class="muted">添加招式后点击底部按钮计算</p></div>
  </div>
</div>

<!-- 底部固定操作栏 -->
<div class="bottom-bar">
  <button class="btn btn-primary" id="calcBest">🏆 最优4招</button>
  <button class="btn" id="calcCurrent">📊 当前顺序</button>
</div>

  var MAX_MOVES = 20;

  // ========== 初始化下拉框 ==========
  function populateSelect(select, options, selectedValue) {
    select.innerHTML = '';
    options.forEach(function(opt) {
      var option = document.createElement('option');
      option.value = opt.value;
      option.textContent = opt.label;
      if (opt.value === selectedValue) option.selected = true;
      select.appendChild(option);
    });
  }

  function initStaticSelects() {
    var typeOptions = TYPES.map(function(t){ return { value:t, label:t }; });
    var typeOptionsWithNone = [{ value:'无', label:'无' }].concat(typeOptions);
    populateSelect(pokeType1, typeOptionsWithNone, '无');
    populateSelect(pokeType2, typeOptionsWithNone, '无');
    var weatherOptions = WEATHER_PRESETS.map(function(w){
      return {
        value: w.name,
        label: w.name === '无' ? '无' : (w.name + (w.note ? '（' + w.note + '）' : ''))
      };
    });
    populateSelect(weatherSel, weatherOptions, '无');
    populateSelect(customWeatherType1, typeOptions, '火');
    populateSelect(customWeatherType2, typeOptionsWithNone, '无');
  }

  function updateTypeOptions(select, selectedValue) {
    var preferred = [];
    if (pokeType1.value !== '无') preferred.push(pokeType1.value);
    if (pokeType2.value !== '无' && preferred.indexOf(pokeType2.value) === -1) preferred.push(pokeType2.value);
    var rest = TYPES.filter(function(t){ return preferred.indexOf(t) === -1; });
    var ordered = preferred.concat(rest);
    var options = ordered.map(function(t){ return { value:t, label:t }; });
    populateSelect(select, options, selectedValue || ordered[0]);
  }

  function updateAllMoveTypeOptions() {
    var selects = document.querySelectorAll('.move-row .mType');
    Array.prototype.forEach.call(selects, function(sel){
      updateTypeOptions(sel, sel.value);
    });
  }

  pokeType1.addEventListener('change', updateAllMoveTypeOptions);
  pokeType2.addEventListener('change', updateAllMoveTypeOptions);
  weatherSel.addEventListener('change', function(){
    customWeather.classList.toggle('hidden', weatherSel.value !== '自定义天气');
  });

  function getWeatherTypes() {
    if (weatherSel.value === '自定义天气') {
      var types = [customWeatherType1.value];
      if (customWeatherType2.value !== '无') types.push(customWeatherType2.value);
      return types;
    }
    var preset = WEATHER_PRESETS.find(function(w){ return w.name === weatherSel.value; });
    return preset ? preset.types : [];
  }

  // ========== 招式行管理 ==========
  var rowCounter = 0;

  function createMoveRow(data) {
    data = data || {};
    if (moveList.querySelectorAll('.move-row').length >= MAX_MOVES) return null;
    rowCounter++;
    var rowId = 'move-' + rowCounter;
    var row = document.createElement('div');
    row.className = 'move-row';
    row.dataset.rowId = rowId;
    row.dataset.expanded = 'false';

    var category = data.category || '物理';
    var power = data.power !== undefined ? data.power : '';
    var name = data.name || '';
    var type = data.type || (pokeType1.value !== '无' ? pokeType1.value : TYPES[0]);
    var buffType = data.buffType || 'attack';
    var buffPower = data.buffPower || 1.5;
    var isBuff = category === '变化';

    var categoryLabel = isBuff ? 'Buff' : category;
    var categoryClass = isBuff ? 'tag-buff' : (category === '物理' ? 'tag-physical' : 'tag-special');
    var summaryText = name || '新招式';

    row.innerHTML = '<div class="move-row-header" data-toggle="' + rowId + '">' +
      '<div class="move-row-summary">' +
      '<span class="mv-name">' + summaryText + '</span>' +
      '<span class="move-tag ' + categoryClass + '">' + categoryLabel + '</span>' +
      '<span class="move-tag tag-type">' + type + '</span>' +

      '</div>' +
      '<div style="display:flex;align-items:center;gap:4px;">' +
      '<button class="delete-btn" data-delete="' + rowId + '" aria-label="删除">✕</button>' +

      '</div>';

    moveList.appendChild(row);

    updateTypeOptions(typeSelect, type);

    var header = row.querySelector('.move-row-header');
    var detail = row.querySelector('.move-row-detail');

    header.addEventListener('click', function(e) {
      if (e.target.closest('.delete-btn')) return;
      var isOpen = detail.classList.toggle('show');
      chevron.classList.toggle('open', isOpen);
      row.dataset.expanded = isOpen ? 'true' : 'false';
    });

    row.querySelector('.delete-btn').addEventListener('click', function(){
      row.remove();
      updateMoveCount();
    });

    var categorySelect = row.querySelector('.mCategory');
    categorySelect.addEventListener('change', function(){
      var isBuffNow = categorySelect.value === '变化';
      var powerInput = row.querySelector('.mPower');
      var existingBuff = row.querySelector('.buff-config-inline');
      if (isBuffNow) {
        powerInput.disabled = true;
        powerInput.value = 0;
        if (!existingBuff) {
          var div = document.createElement('div');
          div.className = 'buff-config-inline';

          powerInput.parentNode.insertBefore(div, powerInput.nextSibling);
        }
        updateRowSummary(row);
      } else {
        powerInput.disabled = false;
        if (powerInput.value === '0') powerInput.value = '';
        if (existingBuff) existingBuff.remove();
        updateRowSummary(row);
      }
    });

    row.querySelector('.mName').addEventListener('input', function(){ updateRowSummary(row); });
    typeSelect.addEventListener('change', function(){ updateRowSummary(row); });
    categorySelect.addEventListener('change', function(){ updateRowSummary(row); });

      '<span class="move-tag ' + categoryClass + '">' + categoryLabel + '</span>' +
      '<span class="move-tag tag-type">' + type + '</span>' +
      (!isBuff ? '<span style="font-size:12px;color:var(--muted);">威力 ' + (power || '?') + '</span>' : '');
  }

  function updateMoveCount() {
    var count = moveList.querySelectorAll('.move-row').length;
    moveCount.textContent = '(' + count + '/' + MAX_MOVES + ')';
  }

  function getMoves() {
    var moves = [];
    var rows = moveList.querySelectorAll('.move-row');
    Array.prototype.forEach.call(rows, function(row){
      var name = row.querySelector('.mName').value.trim() || '招式';
      var type = row.querySelector('.mType').value;
      var category = row.querySelector('.mCategory').value;
      var powerInput = row.querySelector('.mPower');
      var power = parseFloat(powerInput.value);
      if (category === '变化') {
        var bt = row.querySelector('.buffType').value;
        var bp = parseFloat(row.querySelector('.buffPower').value) || 1.5;
        moves.push({ name:name, type:type, category:category, power:0, buffType:bt, buffPower:bp });
      } else if (!isNaN(power) && power > 0) {
        moves.push({ name:name, type:type, category:category, power:power, buffType:null, buffPower:1 });
      }
    });
    return moves;
  }

  // ========== 搜索 ==========
  moveSearch.addEventListener('input', function(){
    var query = moveSearch.value.trim().toLowerCase();
    if (!query) { searchResults.classList.add('hidden'); return; }
    var matches = MOVE_DB.filter(function(m){
      return m.name.toLowerCase().indexOf(query) !== -1 || (m.pinyin || '').indexOf(query) !== -1;
    });
    if (matches.length === 0) {
      searchResults.innerHTML = '<div class="search-item">无匹配</div>';
      searchResults.classList.remove('hidden');
    } else {
      searchResults.innerHTML = matches.slice(0, 15).map(function(m){
        return '<div class="search-item" data-name="' + m.name + '">' + m.name +
          ' <span class="si-type">' + m.type + ' · ' + (m.category === '变化' ? 'Buff' : m.power) + '</span></div>';
      }).join('');
      searchResults.classList.remove('hidden');
      var items = searchResults.querySelectorAll('.search-item');
      Array.prototype.forEach.call(items, function(item){
        item.addEventListener('click', function(){
          var name = this.dataset.name;
          var move = MOVE_DB.find(function(m){ return m.name === name; });
          if (move) {
            createMoveRow(move);
            moveSearch.value = '';
            searchResults.classList.add('hidden');
          }
        });
      });
    }
  });

  document.addEventListener('click', function(e){
    if (!e.target.closest('.search-wrapper')) searchResults.classList.add('hidden');
  });

  // ========== OCR 截图识别 ==========
  ocrBtn.addEventListener('click', function(){ ocrInput.click(); });

  ocrInput.addEventListener('change', function(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      ocrPreview.src = ev.target.result;
      ocrPreview.style.display = 'block';
    };
    reader.readAsDataURL(file);
    ocrClearBtn.style.display = 'inline-flex';

    ocrBtnText.innerHTML = '<span class="spinner"></span> 识别中...';
    ocrBtn.disabled = true;
    ocrStatus.textContent = '正在识别图片文字，请稍候...';

    Tesseract.createWorker('chi_sim').then(function(worker){
      return worker.recognize(file).then(function(result){
        var text = result.data.text;
        worker.terminate();
        ocrResultText.textContent = text;
        ocrResultText.style.display = 'block';
        ocrStatus.textContent = '✅ 识别完成，正在解析招式...';
        var parsed = parseOCRText(text);
        if (parsed.length > 0) {
          var added = 0;
          parsed.forEach(function(moveData){
            if (moveList.querySelectorAll('.move-row').length < MAX_MOVES) {
              createMoveRow(moveData);
              added++;
            }
          });
          ocrStatus.textContent = '✅ 成功识别并导入 ' + added + ' 个招式。请检查属性是否正确，如有误可手动修改。';
        } else {
          ocrStatus.textContent = '⚠️ 未识别到招式，请检查截图是否清晰，或手动添加招式。';
        }
      }).catch(function(err){
        console.error(err);
        ocrStatus.textContent = '❌ 识别失败：' + (err.message || err);
      });
    }).catch(function(err){
      console.error(err);
      ocrStatus.textContent = '❌ 初始化识别引擎失败：' + (err.message || err);
    }).finally(function(){
      ocrBtnText.textContent = '📷 上传截图';
      ocrBtn.disabled = false;
      ocrInput.value = '';
    });
  });

  ocrClearBtn.addEventListener('click', function(){
    ocrPreview.style.display = 'none';
    ocrPreview.src = '';
    ocrResultText.style.display = 'none';
    ocrResultText.textContent = '';
    ocrStatus.textContent = '';
    ocrClearBtn.style.display = 'none';
  });

  function parseOCRText(text) {
    var moves = [];
    var lines = text.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
    lines.forEach(function(line){
      var nameMatch = line.match(/([\u4e00-\u9fa5]{2,8})/);
      if (!nameMatch) return;
      var name = nameMatch[1];
      var dbMatch = MOVE_DB.find(function(m){ return m.name === name; });
      if (dbMatch) {
        moves.push({ name:dbMatch.name, type:dbMatch.type, category:dbMatch.category, power:dbMatch.power, buffType:dbMatch.buffType || null, buffPower:dbMatch.buffPower || 1 });
        return;
      }
      var powerMatch = line.match(/(\d+)/);
      var power = powerMatch ? parseInt(powerMatch[1]) : 0;
      var category = '物理';
      if (line.indexOf('特殊') !== -1) category = '特殊';
      else if (line.indexOf('变化') !== -1 || line.indexOf('Buff') !== -1 || line.indexOf('状态') !== -1) category = '变化';
      if (power > 0 || category === '变化') {
        moves.push({
          name: name,
          type: '一般',
          category: category,
          power: category === '变化' ? 0 : power,
          buffType: category === '变化' ? 'attack' : null,
          buffPower: category === '变化' ? 1.5 : 1
        });
      }
    });
    return moves;
  }

  // ========== 敌方属性 ==========
  function createEnemySet(type1, type2) {
    type1 = type1 || '无';
    type2 = type2 || '无';
    var div = document.createElement('div');
    div.className = 'enemy-set-row';
    div.innerHTML = '<select class="enemyType1" style="flex:1;">' +
      ['无'].concat(TYPES).map(function(t){ return '<option value="' + t + '"' + (t === type1 ? ' selected' : '') + '>' + t + '</option>'; }).join('') +
      '</select>' +
      '<select class="enemyType2" style="flex:1;">' +
      ['无'].concat(TYPES).map(function(t){ return '<option value="' + t + '"' + (t === type2 ? ' selected' : '') + '>' + t + '</option>'; }).join('') +
      '</select>' +
      '<button class="btn btn-sm btn-danger removeEnemySet" style="flex:0 0 auto;">✕</button>';
    div.querySelector('.removeEnemySet').addEventListener('click', function(){ div.remove(); });
    enemySetsDiv.appendChild(div);
  }

  function getEnemySets() {
    var sets = [];
    var rows = enemySetsDiv.querySelectorAll('.enemy-set-row');
    Array.prototype.forEach.call(rows, function(row){
      sets.push({
        type1: row.querySelector('.enemyType1').value,
        type2: row.querySelector('.enemyType2').value
      });
    });
    return sets;
  }

  addEnemySetBtn.addEventListener('click', function(){ createEnemySet(); });

  autoRecommendBtn.addEventListener('click', function(){
    enemySetsDiv.innerHTML = '';
    var moves = getMoves();
    var damageMoves = moves.filter(function(m){ return m.category !== '变化'; });
    if (damageMoves.length === 0) { alert('请先添加伤害招式'); return; }

    function hasZero(ms, es) { return ms.some(function(m){ return getEnemyMultiplier(m.type, es) === 0; }); }
    function calcScore(ms, es) { return ms.reduce(function(sum, m){ return sum + m.power * getEnemyMultiplier(m.type, es); }, 0); }

    var best = null, bestScore = -1;
    TYPES.forEach(function(t){
      var s = { type1:t, type2:'无' };
      if (hasZero(damageMoves, s)) return;
      var sc = calcScore(damageMoves, s);
      if (sc > bestScore) { bestScore = sc; best = s; }
    });
    for (var i = 0; i < TYPES.length; i++) {
      for (var j = i+1; j < TYPES.length; j++) {
        var s2 = { type1:TYPES[i], type2:TYPES[j] };
        if (hasZero(damageMoves, s2)) continue;
        var sc2 = calcScore(damageMoves, s2);
        if (sc2 > bestScore) { bestScore = sc2; best = s2; }
      }
    }
    if (best) {
      createEnemySet(best.type1, best.type2);
      alert('推荐克制组合：' + best.type1 + '/' + best.type2 + '（评分 ' + bestScore.toFixed(0) + '）');
    } else {
      alert('未找到无免疫的克制组合');
    }
  });

  // ========== 计算 ==========
  function getBaseOptions() {
    var pokeTypes = [];
    if (pokeType1.value !== '无') pokeTypes.push(pokeType1.value);
    if (pokeType2.value !== '无' && pokeTypes.indexOf(pokeType2.value) === -1) pokeTypes.push(pokeType2.value);
    var isSingle = pokeTypes.length === 1;
    return {
      attack: parseFloat(atkInput.value) || 0,
      specialAttack: parseFloat(spaInput.value) || 0,
      pokeTypes: pokeTypes,
      isSingle: isSingle,
      crossMult: parseFloat(crossMultInput.value) || 1.3,
      weatherMult: parseFloat(weatherMultInput.value) || 1.5,
      weatherTypes: getWeatherTypes(),
      enemySet: null
    };
  }

  function getStab(moveType, options) {
    if (options.pokeTypes.length === 0) return 1;
    if (options.pokeTypes.indexOf(moveType) === -1) return 1.0;
    return options.isSingle ? 1.7 : 1.5;
  }

  function getEnemyMultiplier(moveType, enemySet) {
    if (!enemySet || (enemySet.type1 === '无' && enemySet.type2 === '无')) return 1;
    var mult = 1;
    if (enemySet.type1 !== '无') mult *= (typeChart[moveType] && typeChart[moveType][enemySet.type1] !== undefined ? typeChart[moveType][enemySet.type1] : 1);
    if (enemySet.type2 && enemySet.type2 !== '无') mult *= (typeChart[moveType] && typeChart[moveType][enemySet.type2] !== undefined ? typeChart[moveType][enemySet.type2] : 1);
    return mult;
  }

  function calcRound(sequence, options) {
    var atkBuff = 1, spaBuff = 1;
    var currentWeatherTypes = options.weatherTypes.slice();
    var total = 0;
    var details = [];
    var damageMoves = sequence.filter(function(m){ return m.category !== '变化'; });
    var n = damageMoves.length;
    if (n === 0) return { total:0, details:[] };

    var crossFlags = new Array(n);
    for (var i = 0; i < n; i++) {
      var move = damageMoves[i];
      var prevMove = damageMoves[(i-1+n)%n];
      crossFlags[i] = (move.type !== prevMove.type) ? options.crossMult : 1;
    }

    var dIdx = 0;
    sequence.forEach(function(move){
      if (move.category === '变化') {
        var bp = move.buffPower || 1;
        if (move.buffType === 'attack') atkBuff *= bp;
        else if (move.buffType === 'special') spaBuff *= bp;
        else if (move.buffType === 'both') { atkBuff *= bp; spaBuff *= bp; }
        else if (move.buffType === 'weather') {
          var wm = { '大晴天':['火'],'求雨':['水'],'冰雹':['冰'],'沙暴':['岩石','地面','钢'],'电气场地':['电'],'青草场地':['草'],'精神场地':['超能力'],'薄雾场地':['妖精'] };
          currentWeatherTypes = wm[move.name] || [];
        }
        details.push({ move: move, damage:0, note:'Buff：' + move.buffType + (bp ? ' ×' + bp : '') });
        return;
      }
      var isPhys = move.category === '物理';
      var baseStat = isPhys ? options.attack : options.specialAttack;
      var stab = getStab(move.type, options);
      var cross = crossFlags[dIdx];
      var weatherMult = currentWeatherTypes.indexOf(move.type) !== -1 ? options.weatherMult : 1;
      var enemyMult = getEnemyMultiplier(move.type, options.enemySet);
      var buff = isPhys ? atkBuff : spaBuff;
      var damage = baseStat * move.power * stab * cross * weatherMult * enemyMult * buff;
      total += damage;
      details.push({
        move: move, damage: damage, stab: stab, cross: cross, weatherMult: weatherMult, enemyMult: enemyMult, buff: buff,
        note: '本系×' + stab.toFixed(2) + ' 交叉×' + cross.toFixed(2) + ' 天气×' + weatherMult.toFixed(2) + ' 克制×' + enemyMult.toFixed(2) + ' Buff×' + buff.toFixed(2)
      });
      dIdx++;
    });
    return { total: total, details: details };
  }

  function permute(arr) {
    if (arr.length <= 1) return [arr];
    var result = [];
    for (var i = 0; i < arr.length; i++) {
      var rest = arr.slice(0,i).concat(arr.slice(i+1));
      permute(rest).forEach(function(p){ result.push([arr[i]].concat(p)); });
    }
    return result;
  }

  function enumerateAll(moves, options) {
    var n = moves.length;
    if (n < 4) return [];
    var results = [];
    for (var i = 0; i < n; i++) {
      for (var j = i+1; j < n; j++) {
        for (var k = j+1; k < n; k++) {
          for (var l = k+1; l < n; l++) {
            var combo = [moves[i], moves[j], moves[k], moves[l]];
            var buffCount = combo.filter(function(m){ return m.category === '变化'; }).length;
            if (buffCount > 1) continue;
            var sequences;
            if (buffFirst.checked && buffCount === 1) {
              var buffMove = combo.find(function(m){ return m.category === '变化'; });
              var others = combo.filter(function(m){ return m !== buffMove; });
              sequences = permute(others).map(function(perm){ return [buffMove].concat(perm); });
            } else {
              sequences = permute(combo);
            }
            sequences.forEach(function(seq){
              var result = calcRound(seq, options);
              results.push({ seq: seq, total: result.total, details: result.details });
            });
          }
        }
      }
    }
    results.sort(function(a, b){ return b.total - a.total; });
    return results;
  }

  function formatDamage(v) { return Math.round(v * 100) / 100; }

  function renderBest() {
    var moves = getMoves();
    if (moves.length < 4) {
      resultsDiv.innerHTML = '<p class="muted">至少需要4个有效招式</p>';
      return;
    }
    var options = getBaseOptions();
    var enemySets = getEnemySets();
    if (enemySets.length === 0) enemySets.push({ type1:'无', type2:'无' });

    var html = '';
    enemySets.forEach(function(es){
      var opts = Object.assign({}, options, { enemySet: es });
      var results = enumerateAll(moves, opts);
      if (results.length === 0) return;
      var top = results.slice(0, 3);
      var label = (es.type1 === '无' && es.type2 === '无') ? '无克制' : (es.type1 + (es.type2 !== '无' ? '/' + es.type2 : ''));
      html += '<h3 style="margin:8px 0;font-size:15px;font-weight:700;">🎯 敌方：' + label + '</h3>';
      top.forEach(function(r, rank){
        var seqText = r.seq.map(function(m){
          return m.category === '变化' ? '<b>' + m.name + '</b>(Buff)' : '<b>' + m.name + '</b>(' + m.type + '/' + m.power + ')';
        }).join(' → ');
        html += '<div class="result-panel"><span class="rank-badge">第' + (rank+1) + '名</span>' +
          '<div class="total">' + formatDamage(r.total) + '</div>' +
          '<div class="seq">' + seqText + '</div>' +
          '<div class="detail">';
        r.details.forEach(function(d){
          if (d.move.category === '变化') {
            html += '<div>' + d.move.name + '：伤害0（' + d.note + '）</div>';
          } else {
            html += '<div>' + d.move.name + '：' + formatDamage(d.damage) + '（' + d.note + '）</div>';
          }
        });
        html += '</div></div>';
      });
      html += '<hr style="margin:10px 0;border-color:var(--border);">';
    });
    resultsDiv.innerHTML = html || '<p class="muted">无结果</p>';
    resultsDiv.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  function renderCurrent() {
    var moves = getMoves();
    if (moves.length === 0) { resultsDiv.innerHTML = '<p class="muted">请先添加招式</p>'; return; }
    var seq = moves.slice(0, 4);
    var options = getBaseOptions();
    var es = getEnemySets();
    options.enemySet = es.length > 0 ? es[0] : { type1:'无', type2:'无' };
    var result = calcRound(seq, options);
    var html = '<div class="result-panel"><div class="total">一轮总威力：' + formatDamage(result.total) + '</div>' +
      '<div class="seq">' + seq.map(function(m){ return '<b>' + m.name + '</b>(' + m.type + '/' + (m.category === '变化' ? 'Buff' : m.power) + ')'; }).join(' → ') + '</div>' +
      '<div class="detail">';
    result.details.forEach(function(d){
      if (d.move.category === '变化') html += '<div>' + d.move.name + '：伤害0（' + d.note + '）</div>';
      else html += '<div>' + d.move.name + '：' + formatDamage(d.damage) + '（' + d.note + '）</div>';
    });
    html += '</div></div>';
    resultsDiv.innerHTML = html;
    resultsDiv.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  calcBestBtn.addEventListener('click', renderBest);
  calcCurrentBtn.addEventListener('click', renderCurrent);

  addMoveBtn.addEventListener('click', function(){ createMoveRow(); });
  clearAllBtn.addEventListener('click', function(){ moveList.innerHTML = ''; updateMoveCount(); });
  expandAllBtn.addEventListener('click', function(){
    var allExpanded = moveList.querySelectorAll('.move-row-detail.show').length === moveList.querySelectorAll('.move-row-detail').length;
    var rows = moveList.querySelectorAll('.move-row');
    Array.prototype.forEach.call(rows, function(row){
      var detail = row.querySelector('.move-row-detail');
      var chevron = row.querySelector('.chevron');
      if (allExpanded) {
        detail.classList.remove('show');
        chevron.classList.remove('open');
        row.dataset.expanded = 'false';
      } else {
        detail.classList.add('show');
        chevron.classList.add('open');
        row.dataset.expanded = 'true';
      }
    });
    expandAllBtn.textContent = allExpanded ? '▾ 全部展开' : '▴ 全部折叠';
  });

  // ========== 初始化 ==========
  initStaticSelects();
  createEnemySet('无', '无');
  updateMoveCount();

  // 注册 Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){
        console.log('SW registration failed:', err);
      });
    });
  }
})();
</script>
</body>
