<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PokeChill 配招伤害最优计算器</title>

  <!-- PWA 配置 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PokeChill计算器">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">

  <!-- 样式 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="app-title">⚡ PokeChill 配招计算器</div>
    <div class="app-subtitle">粘贴识别结果 · 最优配招 · 一轮总伤害</div>

    <!-- 规则卡片 -->
    <div class="note">
      <b>本系加成</b>：单属性 ×1.7，双属性 ×1.5<br>
      <b>交叉之力</b>：与上一个伤害招式属性不同时触发，默认 ×1.3<br>
      <b>天气加成</b>：匹配天气属性 ×1.5<br>
      <b>敌方克制</b>：绝佳 ×1.5，不佳 ×0.5，免疫 ×0，双属性相乘
    </div>

    <!-- 宝可梦基础 -->
    <div class="card">
      <h2><span class="icon">🎯</span>宝可梦基础</h2>
      <div class="grid-4">
        <label>属性1
          <select id="pokeType1" class="bg-type"></select>
        </label>
        <label>属性2
          <select id="pokeType2" class="bg-type"></select>
        </label>
        <label>攻击
          <input id="atk" type="number" min="1" placeholder="—">
        </label>
        <label>特攻
          <input id="spa" type="number" min="1" placeholder="—">
        </label>
      </div>
      <div class="grid" style="margin-top:10px;">
        <label>天气
          <select id="weather"></select>
        </label>
        <div id="customWeather" class="hidden" style="display:flex;gap:6px;">
          <select id="customWeatherType1" class="bg-type"></select>
          <select id="customWeatherType2" class="bg-type"></select>
        </div>
        <label>交叉倍率
          <input id="crossMult" type="number" step="0.1" min="1" value="1.3">
        </label>
        <label>天气倍率
          <input id="weatherMult" type="number" step="0.1" min="1" value="1.5">
        </label>
      </div>
    </div>

    <!-- 豆包识别结果粘贴 -->
    <div class="card">
      <h2><span class="icon">📋</span>豆包识别结果</h2>
      <p class="muted" style="margin-top:-6px;font-size:13px;">粘贴豆包识别结果，每行一个招式：名称,属性,分类,威力</p>
      <textarea id="pasteInput" placeholder="藤鞭,草,物理,45&#10;溶解液,毒,特殊,40&#10;剑舞,一般,变化,0,attack,2"></textarea>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn btn-primary" id="parsePaste">解析并添加</button>
        <button class="btn btn-sm" id="clearPaste">清空</button>
      </div>
    </div>

    <!-- 搜索招式 -->
    <div class="card">
      <h2><span class="icon">🔍</span>搜索招式</h2>
      <div class="search-wrapper">
        <input id="moveSearch" placeholder="拼音首字母或名称，如 ftgj / 伏特攻击" autocomplete="off">
        <div id="searchResults" class="search-results hidden"></div>
      </div>
    </div>

    <!-- 候选招式 -->
    <div class="card">
      <h2><span class="icon">📋</span>候选招式 <span id="moveCount" style="font-size:13px;color:var(--muted);font-weight:400;">(0/20)</span></h2>
      <div class="btn-row" style="margin-bottom:8px;">
        <button class="btn btn-sm" id="addMove">＋ 手动添加</button>
        <button class="btn btn-sm btn-danger" id="clearAll">🗑 清空全部</button>
        <button class="btn btn-sm" id="expandAll">▾ 全部展开</button>
      </div>
      <div id="moveList"></div>
      <div class="btn-row" style="margin-top:10px;">
        <label style="font-size:13px;font-weight:600;flex-direction:row;align-items:center;gap:6px;">
          <input type="checkbox" id="buffFirst" checked style="width:auto;">
          Buff必须第一招
        </label>
      </div>
    </div>

    <!-- 敌方属性 -->
    <div class="card">
      <h2><span class="icon">👾</span>敌方属性</h2>
      <div class="btn-row" style="margin-bottom:8px;">
        <button class="btn btn-sm btn-primary" id="autoRecommend">✨ 自动推荐克制</button>
        <button class="btn btn-sm" id="addEnemySet">＋ 手动添加</button>
      </div>
      <div id="enemySets"></div>
    </div>

    <!-- 结果 -->
    <div class="card">
      <h2><span class="icon">📊</span>计算结果</h2>
      <div id="results"><p class="muted">添加招式后点击底部按钮计算</p></div>
    </div>
  </div>

  <!-- 底部固定操作栏 -->
  <div class="bottom-bar">
    <button class="btn btn-primary" id="calcBest">🏆 最优4招</button>
    <button class="btn" id="calcCurrent">📊 当前顺序</button>
  </div>

  <!-- 脚本 -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
