<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PokeChill 配招伤害最优计算器</title>

  <!-- PWA 配置 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PokeChill计算器">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">

  <!-- Tesseract.js OCR 库 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    /* 样式保持不变，与之前相同 */
    :root {
      --bg: #F3F4F6;
      --card-bg: #FFFFFF;
      --title: #1F2937;
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --success: #059669;
      --danger: #DC2626;
      --text: #1F2937;
      --muted: #6B7280;
      --border: #E5E7EB;
      --border-focus: #6366F1;
      --radius-card: 20px;
      --radius-input: 14px;
      --radius-btn: 12px;
      --shadow-card: 0 4px 20px rgba(0,0,0,0.06);
      --shadow-hover: 0 4px 16px rgba(79,70,229,0.25);
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      margin: 0;
      padding: 16px 12px 100px;
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .app-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--title);
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .app-subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 16px;
      font-weight: 400;
    }

    .note {
      background: #EEF2FF;
      border-left: 4px solid var(--primary);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
      color: #374151;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-card);
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 17px;
      font-weight: 700;
      color: var(--title);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card h2 .icon {
      font-size: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    input,
    select,
    textarea {
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-input);
      font-size: 15px;
      background: #fff;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
      color: var(--text);
      -webkit-appearance: none;
      appearance: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }

    .btn {
      padding: 12px 18px;
      border: none;
      border-radius: var(--radius-btn);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #E5E7EB;
      color: #1F2937;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      flex: 1;
      min-height: 46px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px rgba(79,70,229,0.3);
    }

    .btn-primary:active {
      background: var(--primary-hover);
      box-shadow: 0 1px 4px rgba(79,70,229,0.4);
    }

    .btn-success {
      background: var(--success);
      color: #fff;
      box-shadow: 0 2px 8px rgba(5,150,105,0.3);
    }

    .btn-danger {
      background: #FEE2E2;
      color: var(--danger);
    }

    .btn-sm {
      padding: 8px 12px;
      font-size: 13px;
      min-height: auto;
      flex: none;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .move-row {
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      margin-bottom: 6px;
      background: #FAFBFC;
      transition: border-color 0.2s;
    }

    .move-row:focus-within {
      border-color: var(--border-focus);
    }

    .move-row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      gap: 8px;
    }

    .move-row-summary {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 14px;
      font-weight: 600;
    }

    .move-row-summary .mv-name {
      color: var(--title);
    }

    .move-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .tag-physical { background: #FEE2E2; color: #B91C1C; }
    .tag-special { background: #DBEAFE; color: #1D4ED8; }
    .tag-buff { background: #FEF3C7; color: #B45309; }
    .tag-type { background: #E0E7FF; color: #3730A3; }

    .move-row-detail {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .move-row-detail.show {
      display: flex;
    }

    .move-row-detail input,
    .move-row-detail select {
      font-size: 14px;
      padding: 8px 10px;
    }

    .move-row-detail .mName { flex: 1 1 100px; min-width: 80px; }
    .move-row-detail .mType { min-width: 90px; flex: 0 0 auto; }
    .move-row-detail .mCategory { min-width: 80px; flex: 0 0 auto; }
    .move-row-detail .mPower { width: 70px; flex: 0 0 auto; }

    .delete-btn {
      background: none;
      border: none;
      color: #9CA3AF;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 6px;
      transition: color 0.2s;
    }

    .delete-btn:hover { color: var(--danger); }

    .chevron {
      transition: transform 0.25s ease;
      font-size: 12px;
      color: var(--muted);
    }

    .chevron.open { transform: rotate(180deg); }

    .search-wrapper {
      position: relative;
    }

    .search-results {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .search-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid #F3F4F6;
      font-size: 14px;
      transition: background 0.15s;
    }

    .search-item:last-child { border-bottom: none; }
    .search-item:hover, .search-item:active { background: #EEF2FF; }
    .search-item .si-type { color: var(--muted); font-size: 12px; margin-left: 4px; }

    .ocr-area {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .ocr-preview {
      max-width: 100%;
      max-height: 160px;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
      object-fit: contain;
    }

    .ocr-result-text {
      background: #F9FAFB;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.6;
      max-height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--muted);
      margin-top: 8px;
    }

    .result-panel {
      background: #EFF6FF;
      border: 1.5px solid #BFDBFE;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .result-panel .total {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .result-panel .seq {
      margin: 6px 0;
      font-size: 14px;
      line-height: 1.6;
      font-weight: 600;
    }

    .result-panel .detail {
      font-size: 13px;
      color: #4B5563;
      margin-top: 6px;
      line-height: 1.8;
    }

    .result-panel .rank-badge {
      display: inline-block;
      background: var(--primary);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 4px;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
      z-index: 50;
    }

    .enemy-set-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .enemy-set-row select {
      flex: 1;
      min-width: 100px;
    }

    .hidden { display: none !important; }

    @media (max-width: 420px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .btn { font-size: 14px; padding: 11px 14px; }
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .buff-config-inline {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="app-title">⚡ PokeChill 配招计算器</div>
  <div class="app-subtitle">截图识别 · 最优配招 · 一轮总伤害</div>

  <!-- 规则卡片 -->
  <div class="note">
    <b>本系加成</b>：单属性 ×1.7，双属性 ×1.5<br>
    <b>交叉之力</b>：与上一个伤害招式属性不同时触发，默认 ×1.3<br>
    <b>天气加成</b>：匹配天气属性 ×1.5<br>
    <b>敌方克制</b>：绝佳 ×1.5，不佳 ×0.5，免疫 ×0，双属性相乘
  </div>

  <!-- OCR 截图识别 -->
  <div class="card">
    <h2><span class="icon">📸</span>截图导入招式</h2>
    <p class="muted" style="margin-top:-6px;font-size:13px;">上传PokeChill招式页面截图，自动识别招式并填入</p>
    <div class="ocr-area">
      <input type="file" id="ocrInput" accept="image/*" capture="environment" style="display:none">
      <button class="btn btn-primary" id="ocrBtn">
        <span id="ocrBtnText">📷 上传截图</span>
      </button>
      <button class="btn btn-sm" id="ocrClearBtn" style="display:none;">清除</button>
    </div>
    <img id="ocrPreview" class="ocr-preview" alt="预览">
    <div id="ocrResultText" class="ocr-result-text" style="display:none;"></div>
    <div id="ocrStatus" class="muted" style="margin-top:8px;font-size:13px;"></div>
  </div>

  <!-- 搜索招式 -->
  <div class="card">
    <h2><span class="icon">🔍</span>搜索招式</h2>
    <div class="search-wrapper">
      <input id="moveSearch" placeholder="拼音首字母或名称，如 ftgj / 伏特攻击" autocomplete="off">
      <div id="searchResults" class="search-results hidden"></div>
    </div>
  </div>

  <!-- 宝可梦基础 -->
  <div class="card">
    <h2><span class="icon">🎯</span>宝可梦基础</h2>
    <div class="grid-4">
      <label>属性1
        <select id="pokeType1"></select>
      </label>
      <label>属性2
        <select id="pokeType2"></select>
      </label>
      <label>攻击
        <input id="atk" type="number" min="1" placeholder="—">
      </label>
      <label>特攻
        <input id="spa" type="number" min="1" placeholder="—">
      </label>
    </div>
    <div class="grid" style="margin-top:10px;">
      <label>天气
        <select id="weather"></select>
      </label>
      <div id="customWeather" class="hidden" style="display:flex;gap:6px;">
        <select id="customWeatherType1"></select>
        <select id="customWeatherType2"></select>
      </div>
      <label>交叉倍率
        <input id="crossMult" type="number" step="0.1" min="1" value="1.3">
      </label>
      <label>天气倍率
        <input id="weatherMult" type="number" step="0.1" min="1" value="1.5">
      </label>
    </div>
  </div>

  <!-- 敌方属性 -->
  <div class="card">
    <h2><span class="icon">👾</span>敌方属性</h2>
    <div class="btn-row" style="margin-bottom:8px;">
      <button class="btn btn-sm btn-primary" id="autoRecommend">✨ 自动推荐克制</button>
      <button class="btn btn-sm" id="addEnemySet">＋ 手动添加</button>
    </div>
    <div id="enemySets"></div>
  </div>

  <!-- 候选招式 -->
  <div class="card">
    <h2><span class="icon">📋</span>候选招式 <span id="moveCount" style="font-size:13px;color:var(--muted);font-weight:400;">(0/20)</span></h2>
    <div class="btn-row" style="margin-bottom:8px;">
      <button class="btn btn-sm" id="addMove">＋ 手动添加</button>
      <button class="btn btn-sm btn-danger" id="clearAll">🗑 清空全部</button>
      <button class="btn btn-sm" id="expandAll">▾ 全部展开</button>
    </div>
    <div id="moveList"></div>
    <div class="btn-row" style="margin-top:10px;">
      <label style="font-size:13px;font-weight:600;flex-direction:row;align-items:center;gap:6px;">
        <input type="checkbox" id="buffFirst" checked style="width:auto;">
        Buff必须第一招
      </label>
    </div>
  </div>

  <!-- 结果 -->
  <div class="card">
    <h2><span class="icon">📊</span>计算结果</h2>
    <div id="results"><p class="muted">添加招式后点击底部按钮计算</p></div>
  </div>
</div>

<!-- 底部固定操作栏 -->
<div class="bottom-bar">
  <button class="btn btn-primary" id="calcBest">🏆 最优4招</button>
  <button class="btn" id="calcCurrent">📊 当前顺序</button>
</div>

<script>
/* ===== 与之前完全相同的 JavaScript 代码 ===== */
/* 此处省略，请将之前版本的 <script> 内容完整粘贴到这里 */

// 最后注册 Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.log('SW registration failed:', err);
    });
  });
}
</script>
</body>
</html>
